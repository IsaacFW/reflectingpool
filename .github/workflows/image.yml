name: image

# Tests every push and publishes the container image to GitHub's registry:
#   ghcr.io/<owner>/<repo>:<branch>         moves with the branch
#   ghcr.io/<owner>/<repo>:<branch>-<sha>   one fixed build
#   ghcr.io/<owner>/<repo>:latest           the default branch only
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: |
          docker run --rm -v "$PWD":/src -w /src -e CGO_ENABLED=0 -e GOFLAGS=-buildvcs=false \
            golang:1.27-alpine sh -c 'go vet ./... && go test ./...'

      # The interface has no build step, so these two are its only checks:
      # the types its comments declare, and a real browser working through it.
      - name: Type-check the interface
        run: scripts/typecheck.sh

      - name: Browser tests
        run: scripts/e2e.sh

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Registry names are lower case; a tag cannot contain "/".
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.\n-' '-')"
          version="$branch-$(echo "$GITHUB_SHA" | cut -c1-7)"

          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --build-arg VERSION="$version" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.licenses=MIT \
            -t "$image:$branch" -t "$image:$version" .
          docker push "$image:$branch"
          docker push "$image:$version"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            docker tag "$image:$branch" "$image:latest"
            docker push "$image:latest"
          fi
          echo "Published $image:$branch and $image:$version" >> "$GITHUB_STEP_SUMMARY"
