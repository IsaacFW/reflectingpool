name: attacks

# The attacks the security review described, as a workflow of their own, so
# that a failure says what it is. The same tests run inside the image
# workflow's Test step as well; here they also run under the race detector,
# and each one is listed in the log.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Attack tests
        run: |
          docker run --rm -v "$PWD":/src -w /src -e GOFLAGS=-buildvcs=false \
            golang:1.27 go test -race -count=1 -v -run 'TestAttack' ./...
